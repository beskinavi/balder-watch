name: Balder watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub может запаздывать)
  workflow_dispatch:         # ручной запуск кнопкой

permissions:
  contents: write            # нужно, чтобы сохранять seen.json

concurrency:
  group: balder-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python balder_watch.py
      - name: Save state
        if: always()
        run: |
          git config user.name "balder-bot"
          git config user.email "balder-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
